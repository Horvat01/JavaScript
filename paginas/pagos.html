<!doctype html>
<html lang="es">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>GameShop | Finalizar Compra</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../estilos/styles.css">
    <script src="../js/pagos.js" defer></script>
    <link rel="stylesheet" type="text/css" href="https://cdn.jsdelivr.net/npm/toastify-js/src/toastify.min.css">
</head>

<body class="bodypagos">

    <header>
        <nav class="navbar navbar-dark bg-dark px-3 shadow">
            <a class="navbar-brand mb-0 h1" href="../index.html">GameShop</a>
            <span class="navbar-brand mb-0 h1 active" aria-current="page"> / Pagos</span>
        </nav>
    </header>

    <main class="container my-5">
        <div class="row">
            <header class="col-12 mb-4">
                <h1 class="display-5 fw-bold">Finalizar mi compra</h1>
                <p class="text-muted">Completá tus datos para generar el comprobante.</p>
            </header>

            <section class="col-md-7">
                <div class="card shadow-sm p-4">
                    <form id="formFinal">
                        <h4 class="mb-3 border-bottom pb-2">Datos de Envío</h4>
                        
                        <div class="mb-3">
                            <label class="form-label">Nombre Completo</label>
                            <input type="text" class="form-control" id="nombre" 
                                   placeholder="Ej: Juan Pérez" 
                                   pattern="^[a-zA-ZáéíóúÁÉÍÓÚñÑ\s]{3,40}$" 
                                   title="Ingresá solo letras (mínimo 3)" 
                                   required>
                        </div>

                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label class="form-label">País</label>
                                <select class="form-select" id="pais" required>
                                    <option value="" selected disabled>Seleccionar...</option>
                                    <option value="Argentina">Argentina</option>
                                    <option value="Chile">Chile</option>
                                    <option value="Uruguay">Uruguay</option>
                                    <option value="México">México</option>
                                </select>
                            </div>
                            <div class="col-md-6 mb-3">
                                <label class="form-label">Dirección de Envío</label>
                                <input type="text" class="form-control" id="direccion" 
                                       placeholder="Calle y altura" minlength="5" required>
                            </div>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Email</label>
                            <input type="email" class="form-control" id="email" 
                                   placeholder="nombre@ejemplo.com" required>
                        </div>

                        <h4 class="mt-4 mb-3 border-bottom pb-2">Información de Pago</h4>
                        <div class="mb-3">
                            <label class="form-label">Número de Tarjeta</label>
                            <input type="text" class="form-control" id="tarjeta" 
                                   placeholder="16 dígitos" maxlength="16" 
                                   pattern="\d{16}" title="Deben ser 16 números exactos" required>
                        </div>

                        <div class="row">
                            <div class="col-6 mb-3">
                                <label class="form-label">Expiración</label>
                                <input type="text" class="form-control" placeholder="MM/AA" 
                                       maxlength="5" pattern="\d{2}/\d{2}" required>
                            </div>
                            <div class="col-6 mb-3">
                                <label class="form-label">CVV</label>
                                <input type="password" class="form-control" placeholder="123" 
                                       maxlength="3" pattern="\d{3}" required>
                            </div>
                        </div>

                        <button type="submit" class="btn btn-primary btn-lg w-100 mt-3 shadow-sm">
                            CONFIRMAR Y GENERAR TICKET
                        </button>
                    </form>
                </div>
            </section>

            <aside class="col-md-5">
                <div class="card shadow-sm border-0">
                    <div class="card-header bg-dark text-white">
                        <h4 class="mb-0">Resumen de Compra</h4>
                    </div>
                    <div class="card-body bg-light">
                        <ul class="list-group list-group-flush" id="resumenCompra">
                            </ul>
                    </div>
                </div>
            </aside>
        </div>
    </main>

    <footer class="bg-dark text-light mt-auto py-4">
        <div class="container text-center">
            <p class="mb-0">© 2026 GameShop - Proyecto Final JS - Mathias Horvat</p>
        </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/toastify-js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
